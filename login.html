<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BlurMc</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Blur</span>Mc
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="rules.html">Rules</a>
        <a href="#">Vote</a>
        <a href="#">Store</a>
    </nav>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            Blur<span>Mc</span>
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-description">
            Login to your BlurMc account.
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <div
            id="loginMessage"
            class="auth-message"
        ></div>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<footer>

    <div class="footer-logo">
        Blur<span>Mc</span>
    </div>

    <p>
        © 2026 BlurMc Network. All rights reserved.
    </p>

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://uunmqbthiyyipgnjayry.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z_Bal3Jr5D8NepOFge2quQ_qBsqJaWF";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("loginMessage");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "auth-message " + type;

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            const {
                data,
                error
            } = await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Login failed."
                );

            }


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 800);


        } catch (error) {

            console.error(error);

            showMessage(
                "Invalid email or password.",
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>

      </html>
